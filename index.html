<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-2">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Komunitas Elaina Indonesia</title>
    <style>
        body {
            margin: 0; padding: 20px; font-family: sans-serif;
            background:
linear-gradient(rgba(0,0,0,0.60), rgba(0,0,0,0.60)),
url("gol.gif") center center / cover no-repeat fixed;
            color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh;
            position: relative; overflow: hidden;
        }

        /* TARTIKEL ANIMASI ANIME BERGERAK MURNI KODE (ANTI-GAGAL) */
        .bg-animation {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }
        .particle {
            position: absolute; background: rgba(186, 159, 247, 0.5); border-radius: 50%;
            animation: floatUp infinite linear; box-shadow: 0 0 10px rgba(186, 159, 247, 0.8);
        }
        /* Mengatur kecepatan dan ukuran bintik cahaya anime */
        .p1 { width: 6px; height: 6px; left: 15%; animation-duration: 9s; animation-delay: 0s; }
        .p2 { width: 12px; height: 12px; left: 35%; animation-duration: 14s; animation-delay: 2s; }
        .p3 { width: 5px; height: 5px; left: 55%; animation-duration: 11s; animation-delay: 1s; }
        .p4 { width: 9px; height: 9px; left: 75%; animation-duration: 13s; animation-delay: 4s; }
        .p5 { width: 11px; height: 11px; left: 90%; animation-duration: 10s; animation-delay: 3s; }

        @keyframes floatUp {
            0% { transform: translateY(105vh) scale(0.5); opacity: 0; }
            50% { opacity: 0.9; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        /* KARTU UTAMA DI ATAS LAPISAN ANIMASI */
        .card {
            position: relative; z-index: 1;
            background: rgba(255, 255, 255, 0.04); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 30px 20px; 
            width: 100%; max-width: 350px; text-align: center; box-shadow: 0 10px 32px rgba(0,0,0,0.60);
        }
        .profile-pic {
            width: 90px; height: 90px; border-radius: 100%; border: 3px solid #ba9ff7;
            margin: 0 auto 15px; overflow: hidden; box-shadow: 0 0 15px rgba(186,159,247,0.5);
        }
        .profile-pic img { width: 100%; height: 100%; object-fit: cover; }
        h1 { font-size: 22px; margin: 10px 0 5px; }
        .sub { font-size: 14px; color: #ba9ff7; font-style: italic; margin-bottom: 25px; }
        .btn {
            display: flex; align-items: center; background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
            padding: 12px; margin-bottom: 12px; text-decoration: none; color: white; text-align: left;
        }
        .wa { border-left: 5px solid #25D366; } .tt { border-left: 5px solid #ff0050; } .yt { border-left: 5px solid #FF0000; }
        .icon { font-size: 24px; margin-right: 15px; }
        .text { flex-grow: 1; } .text b { display: block; font-size: 15px; } .text span { font-size: 11px; color: #a6a6a6; }
        .footer { font-size: 11px; color: #ffffff; margin-top: 25px; }
    </style>
</head>
<body>

    <!-- Wadah Partikel Cahaya Sihir Bergerak -->
    <div class="bg-animation">
        <div class="particle p1"></div>
        <div class="particle p2"></div>
        <div class="particle p3"></div>
        <div class="particle p4"></div>
        <div class="particle p5"></div>
    </div>

    <div class="card">
        <div class="profile-pic">
            <!-- FOTO PROFIL BULAT -->
            <img src="Rendra.png" alt="Profile">
        </div>
        
        <h1>Komunitas Elaina</h1>
        <div class="sub">Majo no Tabitabi</div>

        <!-- Tombol WhatsApp -->
        <a href="https://chat.whatsapp.com/BOOdZHMl7PjGZbGlFWVqH1?s=cl&p=a&mlu=0&ilr=0&amv=3" class="btn wa">
            <span class="icon">💬</span>
            <div class="text"><b>WhatsApp</b><span>join komunitas Elaina</span></div>
            <span>&gt;</span>
        </a>

        <!-- Tombol TikTok -->
        <a href="https://www.tiktok.com/@rendra.aldi7?_r=1&_t=ZS-98PjCeajV9J" class="btn tt">
            <span class="icon">🎵</span>
            <div class="text"><b>TikTok</b><span>Follow akun resmi admin</span></div>
            <span>&gt;</span>
        </a>

        <!-- Tombol YouTube -->
        <a href="https://youtube.com/@rendraaldii?si=Fs2-BgTiKTErw1Zp" class="btn yt">
            <span class="icon">📺</span>
            <div class="text"><b>YouTube</b><span>Subscribe channel admin</span></div>
            <span>&gt;</span>
        </a>

        <div class="footer">
            © 2026 Komunitas Elaina Indonesia<br>
            ✨ The Journey Never Ends ✨
        </div>
    </div>

</body>
</html>
